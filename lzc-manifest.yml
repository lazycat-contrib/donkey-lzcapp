application:
  subdomain: donkey
  background_task: true
  multi_instance: false
  oidc_redirect_path: /console/api/auth/oidc/callback
  public_path:
    - /
  entries:
    - id: admin
      title: Admin console
      path: /console/
    - id: registry
      title: Registry
      path: /v2/
  upstreams:
    - location: /console/
      backend: http://donkey:5003/
    - location: /
      backend: http://donkey:5443/
  injects:
    - id: root-to-console
      on: request
      auth_required: false
      when:
        - /
      do: |
        ctx.response.send(302, "", { location: "/console/" });
    - id: console-trailing-slash
      on: request
      auth_required: false
      when:
        - /console
      do: |
        ctx.response.send(302, "", { location: "/console/" });
    - id: open-save-chooser
      on: browser
      auth_required: false
      when:
        - /console/*
      do:
        - src: file:///lzcapp/pkg/content/lazycat-injects/lzc-file-chooser-inject.js
services:
  donkey:
    # upstream: ghcr.io/ca-x/donkey:v0.2.8
    image: registry.lazycat.cloud/czyt/ca-x/donkey:7ee9ddc137b32c20
    environment:
      - DONKEY_DATA_DIR=/data
      - DONKEY_ADMIN_ADDR=0.0.0.0:5003
      - DONKEY_ADMIN_EXTERNAL_TLS=true
      - DONKEY_REGISTRY_ADDR=0.0.0.0:5443
      - DONKEY_REGISTRY_EXTERNAL_TLS=true
      - DONKEY_OIDC_ISSUER=${LAZYCAT_AUTH_OIDC_ISSUER_URI}
      - DONKEY_OIDC_CLIENT_ID=${LAZYCAT_AUTH_OIDC_CLIENT_ID}
      - DONKEY_OIDC_CLIENT_SECRET=${LAZYCAT_AUTH_OIDC_CLIENT_SECRET}
      - DONKEY_OIDC_REDIRECT_URL=https://${LAZYCAT_APP_DOMAIN}/console/api/auth/oidc/callback
      - DONKEY_OIDC_DISPLAY_NAME=LazyCat
      - DONKEY_CREDENTIAL_KEY={{ stable_secret "donkey_credential_key_v1" | sha256sum }}
      - TZ={{ .U.timezone }}
    binds:
      - /lzcapp/var/data:/data
    user: "root"
    mem_limit: 1024M
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - http://127.0.0.1:5003/api/health
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
